name: Publish install-only release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate tag, bilingual links, and build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/build.py --tag "$RELEASE_TAG"
      - name: Publish downloadable packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/pro-json-viewer.zip
          "dist/pro-json-viewer-${RELEASE_TAG}.zip"
          dist/SHA256SUMS.txt
          --verify-tag --latest
          --title "Pro JSON Viewer ${RELEASE_TAG}"
          --notes-file dist/RELEASE_NOTES.md
